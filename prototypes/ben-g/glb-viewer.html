<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ben Blaze GLB viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1e3f; color: #eef0ff; font: 15px system-ui, sans-serif; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
  button { font: inherit; color: inherit; background: #262b63; border: 2px solid #eef0ff; padding: 4px 9px; cursor: pointer; }
  button[aria-pressed="true"] { background: #55ff55; color: #06210c; font-weight: 700; }
  #note { position: fixed; left: 12px; bottom: 10px; color: #a3a9d2; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="note">Loading models/ben-g/ben-g.glb…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
  camera.position.set(2.6, 1.3, 4.4);
  var controls = new THREE.OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.85, 0); controls.update();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8088c0, 1.0));
  var key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(2.5, 5, 4); scene.add(key);
  var floor = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.66, 0.1, 44), new THREE.MeshStandardMaterial({ color: 0xaa5500, roughness: 0.9 })); floor.position.y = -0.05; scene.add(floor);
  function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  var mixer = null, current = null, clock = new THREE.Clock(), note = document.getElementById('note'), bar = document.getElementById('bar');
  var file = new URLSearchParams(location.search).get('file') || '../../models/ben-g/ben-g.glb';
  new THREE.GLTFLoader().load(file, function (gltf) {
    scene.add(gltf.scene); mixer = new THREE.AnimationMixer(gltf.scene);
    gltf.scene.traverse(function (o) { if (o.isSkinnedMesh) o.frustumCulled = false; });
    function play(clip, button) {
      if (current) current.stop(); current = mixer.clipAction(clip); current.reset().play();
      Array.prototype.forEach.call(bar.children, function (b) { b.setAttribute('aria-pressed', b === button ? 'true' : 'false'); });
    }
    gltf.animations.forEach(function (clip, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = clip.name; b.id = 'clip-' + clip.name; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { play(clip, b); }); bar.appendChild(b); if (i === 0) play(clip, b);
    });
    note.textContent = gltf.animations.length + ' clips · drag to orbit, scroll to zoom';
    window.__viewer = { mixer: mixer, clips: gltf.animations, seek: function (name, t) { var c = gltf.animations.filter(function (x) { return x.name === name; })[0]; play(c, document.getElementById('clip-' + name)); mixer.setTime(t); } };
  }, undefined, function (error) { note.textContent = 'Could not load the model: ' + (error && error.message || error); });
  (function tick() { requestAnimationFrame(tick); if (mixer && !window.__hold) mixer.update(clock.getDelta()); else clock.getDelta(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
